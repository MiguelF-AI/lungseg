server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La app es un SPA (React Router): cualquier ruta no conocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía /api al backend FastAPI (servicio "api" de compose en el puerto 8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cachés de NIfTI (ETag/Last-Modified/304) se respetan: no se anulan aquí
        proxy_cache off;
    }

    # Evitar 404 de favicon
    location = /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }
}
